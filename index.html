<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telosaa | المنيو الرقمي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-icon">🍕</div>
        <div>
          <h1>TELOSAA</h1>
          <p>Delicious Taste, Every Bite</p>
        </div>
      </div>

      <button class="cart-btn" id="cartBtn" aria-label="السلة">
        <span class="cart-icon">🛒</span>
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>

    <!-- Categories bar -->
    <nav class="categories" id="categoriesBar"></nav>
  </header>

  <!-- Main menu -->
  <main class="menu-container">
    <div id="menuSections"></div>
  </main>

  <!-- Floating cart summary -->
  <div class="cart-fab" id="cartFab" hidden>
    <span>🛒 <strong id="fabCount">0</strong> صنف</span>
    <span>عرض السلة</span>
  </div>

  <!-- Cart Drawer -->
  <div class="drawer-overlay" id="drawerOverlay" hidden></div>
  <aside class="cart-drawer" id="cartDrawer">
    <div class="drawer-header">
      <h2>🛒 سلة الطلبات</h2>
      <button class="close-btn" id="closeDrawer">✕</button>
    </div>

    <div class="drawer-body" id="cartItems">
      <p class="empty-msg">السلة فاضية، ابدأ الاختيار 👌</p>
    </div>

    <div class="drawer-footer">
      <div class="total-row">
        <span>الإجمالي</span>
        <strong id="cartTotal">0 ج.م</strong>
      </div>
      <button class="checkout-btn" id="checkoutBtn">إرسال الطلب ✅</button>
      <p class="webhook-status" id="webhookStatus"></p>
    </div>
  </aside>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
